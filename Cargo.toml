[package]
name = "barisvpn"
version = "0.1.0"
edition = "2021"
description = "Bedava V2Ray/VLESS/Trojan/SS/Hysteria/TUIC config toplayici + TCP ve tam tunel dogrulayici"

[[bin]]
name = "barisvpn"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
futures = "0.3"
anyhow = "1"

[profile.release]
opt-level = 2
codegen-units = 1
